name: Validate retrieval and demos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_search.py -v

  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-figure-demos
          path: results/demos/
